[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-agent"
version = "0.1.0"
description = "LLM-backed robot workflow DSL generation service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pylint>=3.2.0",
]

[project.scripts]
workflow-agent = "workflow_agent.main:run"

[tool.setuptools.packages.find]
where = ["src"]

# --- Ruff: formatter + linter (run: ruff format . && ruff check .) ---
[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".git",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["workflow_agent"]

# --- Pylint (run from workflow-agent/: pylint src/workflow_agent) ---
[tool.pylint.main]
py-version = "3.10"
jobs = 0
init-hook = "import sys; sys.path.insert(0, 'src')"
ignore = ["CVS", ".venv", "venv"]

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
    "too-many-branches",
    "too-many-return-statements",
    "too-many-instance-attributes",
    "too-many-positional-arguments",
    "too-many-statements",
    "import-outside-toplevel",
    "broad-exception-caught",
    "duplicate-code",
    "unnecessary-pass",
    "unused-argument",
    "no-else-return",
    # DSL JSON shape uses PascalCase field names in dataclasses
    "invalid-name",
    "unexpected-keyword-arg",
    # Pytest/parametrize patterns; constructor false positives
    "no-value-for-parameter",
    "redefined-outer-name",
    "wrong-import-position",
    # Scaffold: explicit TODO markers and module-level stub state
    "fixme",
    "global-statement",
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
max-module-lines = 2500
